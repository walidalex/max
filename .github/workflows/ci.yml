name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: contracting_erp_test
          MARIADB_USER: erp_test
          MARIADB_PASSWORD: erp_test_password
          MARIADB_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_KEY: ci-test-only-key
      APP_TIMEZONE: Africa/Cairo
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: contracting_erp_test
      DB_USERNAME: erp_test
      DB_PASSWORD: erp_test_password
      DB_CHARSET: utf8mb4
      SESSION_SECURE: false
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, fileinfo
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - name: Wait for MariaDB
        run: |
          for i in {1..30}; do
            php tools/check-database.php >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      - run: php database/migrate.php
      - run: composer db:check
      - run: composer lint
      - run: composer test
      - run: npm run assets:build
